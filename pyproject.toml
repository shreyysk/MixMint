# Vercel reads this file for the Django build step (runs after pip install,
# before deploy). Production builds apply database migrations (preview builds skip
# them, so a branch can never change the live database); every build then collects static files so the
# CDN can serve CSS/JS/vendor. A failed migration fails the build, so the previous
# deployment keeps serving traffic.
# NOTE: Vercel's Python builder uses `uv`, which requires the [project] table
# below. Keep `dependencies` mirrored with requirements.txt.
[project]
name = "mixmint"
version = "2.0.0"
description = "MixMint 2.0 — DJ-first digital music distribution platform (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.17.2",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.6.0",
    "django-environ==0.12.0",
    "django-storages==1.14.4",
    "django-filter==24.3",
    "django-csp==3.8",
    "psycopg2-binary==2.9.10",
    "boto3==1.36.0",
    "razorpay==2.0.1",
    "PyJWT==2.13.0",
    "Pillow==12.3.0",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
    "requests==2.34.2",
    "mutagen==1.47.0",
    "celery==5.4.0",
    "django-celery-beat==2.9.0",
    "redis==5.2.1",
    "reportlab==4.2.5",
    "social-auth-app-django==6.0.1",
    "social-auth-core==5.0.0",
    "sentry-sdk==2.16.0",
    "drf-spectacular==0.30.0",
    "pyotp==2.9.0",
    "segno==1.6.6",
]

[tool.vercel.scripts]
build = "if [ \"$VERCEL_ENV\" = \"production\" ]; then python manage.py migrate --noinput; fi && python manage.py collectstatic --noinput"
