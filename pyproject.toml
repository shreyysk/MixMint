# Vercel reads this file for the Django build step (runs after pip install,
# before deploy). Collects static files so the CDN can serve CSS/JS/vendor.
# NOTE: Vercel's Python builder uses `uv`, which requires the [project] table
# below. Keep `dependencies` mirrored with requirements.txt.
[project]
name = "mixmint"
version = "2.0.0"
description = "MixMint 2.0 — DJ-first digital music distribution platform (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.16",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.6.0",
    "django-environ==0.12.0",
    "django-storages==1.14.4",
    "django-filter==24.3",
    "django-csp==3.8",
    "psycopg2-binary==2.9.10",
    "boto3==1.36.0",
    "razorpay==1.4.2",
    "Pillow==12.3.0",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
    "requests==2.33.0",
    "mutagen==1.47.0",
    "celery==5.4.0",
    "django-celery-beat==2.9.0",
    "redis==5.2.1",
    "reportlab==4.2.5",
    "social-auth-app-django==5.6.0",
    "sentry-sdk==2.16.0",
    "drf-spectacular==0.27.2",
]

[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput"
