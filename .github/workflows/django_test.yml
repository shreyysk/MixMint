name: MixMint CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mixmint_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mixmint_test
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: False
      ENVIRONMENT: test
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
      
      - name: Django system check
        run: python manage.py check
      
      - name: Run migrations
        run: python manage.py migrate
      
      - name: Collect static files (deploy readiness check)
        run: python manage.py collectstatic --noinput
        # Uses production manifest storage to verify staticfiles.json generation works
        # Tests use settings_test.py which overrides to non-manifest storage
      
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ --cov=apps --cov-report=xml --cov-report=term-missing -v --cov-fail-under=40

      - name: Security check (bandit)
        run: |
          pip install bandit
          bandit -r apps/ -x apps/*/migrations/ -ll

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-0 --desc || true
          # `|| true`: report-only for now; flip to hard-fail after first green run

