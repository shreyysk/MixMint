name: MixMint CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mixmint_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mixmint_test
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: False
      ENVIRONMENT: test
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
      
      - name: Django system check
        run: python manage.py check
      
      - name: Run migrations
        run: python manage.py migrate
      
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ --cov=apps --cov-report=xml --cov-report=term-missing -v
      
      - name: Coverage must be > 80%
        run: python -m coverage report --fail-under=80

      - name: Security check (bandit)
        run: |
          pip install bandit
          bandit -r apps/ -x apps/*/migrations/ -ll

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: echo "Add your deployment step here (Render/Railway deploy hook)"
