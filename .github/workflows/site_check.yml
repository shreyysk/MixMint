name: Live site check

# Walks https://mixmint.site as a logged-out visitor every morning (IST) and fails if a page
# or one of the site's own files is broken. GitHub emails you when it fails.
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl mixmint.site
        run: python scripts/site_check.py https://mixmint.site --max 300 --slow 3 --own-assets-only
