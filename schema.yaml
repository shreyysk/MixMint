      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/dj/apply/:
    post:
      operationId: accounts_dj_apply_create
      description: |-
        Submit a DJ application [Spec §7].
        Checks:
        - User is not already a DJ
        - No pending application exists
        - Application fee paid (if enabled by admin)
        - FREE for first 3 months [Spec §7]
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
