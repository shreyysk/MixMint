openapi: 3.0.3
info:
  title: MixMint 2.0 API
  version: 2.0.0
  description: Premium Marketplace for DJ Tool Kits & Exclusive Edits
paths:
  /api/v1/accounts/confirm-age/:
    post:
      operationId: accounts_confirm_age_create
      description: Age confirmation is handled implicitly at signup (18+ ToS acceptance).
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/dj/{dj_profile_id}/approve/:
    post:
      operationId: accounts_dj_approve_create
      description: |-
        Admin approves a DJ application [Spec §3.3].
        Creates DJWallet and updates user role.
      parameters:
      - in: path
        name: dj_profile_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/dj/{dj_profile_id}/grant-pro/:
    post:
      operationId: accounts_dj_grant_pro_create
      description: |-
        Admin manually grants Pro DJ status [Spec P3 §1.5].
        Use for comped upgrades, influencer partnerships, etc.
      parameters:
      - in: path
        name: dj_profile_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/dj/{dj_profile_id}/reject/:
    post:
