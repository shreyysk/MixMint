{# Help desk form. Needs an ancestor x-data="mmHelp(...)". #}
<div class="flex gap-1 p-1 rounded-[10px] bg-[var(--bg-elevated)] border border-[var(--border)] mb-4" role="tablist" x-show="loggedIn">
    <button type="button" role="tab" :aria-selected="tab === 'ask'" @click="tab = 'ask'" class="flex-1 h-[36px] rounded-[8px] text-[13px] font-[600]" :class="tab === 'ask' ? 'bg-[var(--bg-surface)] text-[var(--text-primary)] shadow' : 'text-[var(--text-muted)]'">Ask a question</button>
    <button type="button" role="tab" :aria-selected="tab === 'mine'" @click="tab = 'mine'; loadMine()" class="flex-1 h-[36px] rounded-[8px] text-[13px] font-[600]" :class="tab === 'mine' ? 'bg-[var(--bg-surface)] text-[var(--text-primary)] shadow' : 'text-[var(--text-muted)]'">My questions</button>
</div>

<div x-show="tab === 'ask'">
    <div x-show="sent" x-cloak class="p-4 rounded-[10px] bg-[var(--accent-mint)]/10 border border-[var(--accent-mint)]/30 text-[14px] text-[var(--text-primary)] mb-3" role="status">
        <p x-text="sent"></p>
        <button type="button" class="underline text-[13px] mt-2" @click="sent = ''">Ask something else</button>
    </div>
    <form x-show="!sent" @submit.prevent="send()" class="space-y-3" data-help-form>
        <label class="block"><span class="block text-[13px] font-[600] text-[var(--text-primary)] mb-1">What's it about?</span>
            <select x-model="category" class="input-mm h-[44px] text-[14px]">
                <option value="order">A payment or order</option>
                <option value="download">Downloading my music</option>
                <option value="payout">DJ earnings / payouts</option>
                <option value="dj_application">Becoming a DJ</option>
                <option value="account">My account / login</option>
                <option value="other">Something else</option>
            </select></label>
        <label class="block"><span class="block text-[13px] font-[600] text-[var(--text-primary)] mb-1">Your question</span>
            <textarea x-model="message" required minlength="5" maxlength="5000" rows="4" class="input-mm text-[14px]" style="height:auto;min-height:104px" placeholder="Tell us what happened. An order ID or track name helps."></textarea></label>
        <template x-if="!loggedIn">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="block"><span class="block text-[13px] font-[600] text-[var(--text-primary)] mb-1">Your email</span>
                    <input type="email" x-model="email" required autocomplete="email" class="input-mm h-[44px] text-[14px]" placeholder="you@gmail.com"></label>
                <label class="block"><span class="block text-[13px] font-[600] text-[var(--text-primary)] mb-1">Name <span class="font-normal text-[var(--text-muted)]">(optional)</span></span>
                    <input type="text" x-model="name" autocomplete="name" class="input-mm h-[44px] text-[14px]"></label>
            </div>
        </template>
        <input type="text" x-model="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden">
        <p x-show="error" x-cloak class="text-[13px] text-[var(--accent-red)]" role="alert" x-text="error"></p>
        <button type="submit" class="btn-mm btn-mint w-full h-[48px] text-[14px] font-[700]" :disabled="sending || message.trim().length < 5">
            <span x-text="sending ? 'Sending…' : 'Send to the MixMint team'"></span></button>
    </form>
    {% if help_telegram_url %}
    <a href="{{ help_telegram_url }}" target="_blank" rel="noopener" class="mt-3 w-full h-[46px] rounded-[10px] border border-[var(--border)] flex items-center justify-center gap-2 text-[14px] font-[600] text-[var(--text-primary)] hover:border-[#29A9EB] hover:text-[#29A9EB] transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.8 15.3l-.4 5.2c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.6-17c.3-1.5-.5-2.1-1.5-1.7L1.4 9.9c-1.4.6-1.4 1.4-.2 1.7l5.4 1.7L19 5.6c.6-.4 1.1-.2.7.2z"/></svg>
        Chat with us on Telegram</a>
    {% endif %}
    <p class="mt-3 text-[12px] text-[var(--text-muted)]">Quick answers: <a href="/legal/faq/" class="underline">FAQ</a> · <a href="/legal/refund/" class="underline">Refunds</a></p>
</div>

<div x-show="tab === 'mine'" x-cloak>
    <p x-show="loadingMine" class="text-[13px] text-[var(--text-muted)]">Loading…</p>
    <p x-show="!loadingMine && !tickets.length" class="text-[13px] text-[var(--text-muted)]">No questions yet.</p>
    <ul class="space-y-2">
        <template x-for="t in tickets" :key="t.id">
            <li class="border border-[var(--border)] rounded-[10px] overflow-hidden">
                <button type="button" class="w-full text-left p-3 flex items-center gap-3" @click="openId = openId === t.id ? null : t.id" :aria-expanded="openId === t.id">
                    <span class="flex-1 min-w-0"><span class="block text-[14px] font-[600] text-[var(--text-primary)] truncate" x-text="t.subject"></span>
                        <span class="block text-[12px] text-[var(--text-muted)]" x-text="'#' + t.id + ' · ' + when(t.updated_at)"></span></span>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-[600] shrink-0" :class="t.status === 'answered' ? 'bg-[var(--accent-mint)]/15 text-[var(--accent-mint)]' : 'bg-[var(--bg-elevated)] text-[var(--text-muted)]'" x-text="label(t.status)"></span>
                </button>
                <div x-show="openId === t.id" class="px-3 pb-3 space-y-2">
                    <template x-for="(m, i) in t.messages" :key="i">
                        <div class="p-2.5 rounded-[10px] text-[13px] whitespace-pre-line" :class="m.from === 'admin' ? 'bg-[var(--accent-mint)]/10 ml-6' : 'bg-[var(--bg-elevated)] mr-6'">
                            <p class="text-[11px] font-[600] text-[var(--text-muted)] mb-1" x-text="(m.from === 'admin' ? 'MixMint team' : 'You') + ' · ' + when(m.at)"></p>
                            <p class="text-[var(--text-primary)]" x-text="m.body"></p>
                        </div>
                    </template>
                    <form class="flex gap-2 pt-1" @submit.prevent="reply(t)" x-show="t.status !== 'closed'">
                        <label class="sr-only" :for="'r' + t.id">Reply</label>
                        <input :id="'r' + t.id" x-model="replyText" class="input-mm h-[40px] text-[13px] flex-1" placeholder="Write a reply">
                        <button class="btn-mm btn-mint h-[40px] px-4 text-[13px]">Send</button>
                    </form>
                </div>
            </li>
        </template>
    </ul>
</div>
