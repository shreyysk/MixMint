{# Guest checkout: shown by MM.checkout() when someone who isn't logged in taps Buy. #}
<dialog id="mm-guest" class="mm-dialog" aria-labelledby="mm-guest-title">
    <form method="dialog" class="space-y-4" novalidate>
        <div class="flex items-start justify-between gap-3">
            <div>
                <h2 id="mm-guest-title" class="font-display text-[20px] font-[700] text-[var(--text-primary)]">Where should we send it?</h2>
                <p class="text-[13px] text-[var(--text-muted)] mt-1">No sign-up form. Enter your email to pay — your download is tied to it.</p>
            </div>
            <button type="button" class="w-9 h-9 rounded-full text-[var(--text-muted)] hover:bg-[var(--border)] shrink-0" onclick="this.closest('dialog').close()" aria-label="Close">{% icon "x" %}</button>
        </div>
        <label class="block"><span class="sr-only">Email</span>
            <input type="email" required autocomplete="email" inputmode="email" placeholder="you@gmail.com" class="input-mm h-[50px] text-[15px]"></label>
        <p data-msg class="text-[13px] text-[var(--accent-red)]" role="alert"></p>
        <button type="button" data-send-link hidden class="w-full h-[44px] rounded-[10px] border border-[var(--border)] text-[14px] font-[600] text-[var(--text-primary)]">Email me a sign-in link</button>
        <button type="submit" class="btn-mm btn-mint w-full h-[50px] text-[15px] font-[700]">Continue to payment</button>
        <p class="text-[12px] text-[var(--text-muted)] text-center">Have an account? <a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" class="underline text-[var(--text-primary)]">Log in</a> · Bought before? <a href="{% url 'recover' %}" class="underline text-[var(--text-primary)]">Recover a download</a></p>
    </form>
</dialog>
