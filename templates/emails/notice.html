{% extends "emails/base.html" %}
{% block title %}{{ heading }}{% endblock %}

{% block content %}
<h2>{{ heading }}</h2>
{% for line in lines %}
<p>{{ line }}</p>
{% endfor %}
{% if cta_label and cta_path %}
<p style="text-align: center;">
    <a href="{{ site_url|default:"https://mixmint.site" }}{{ cta_path }}" class="btn">{{ cta_label }}</a>
</p>
{% endif %}
{% endblock %}
