<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — MixMint</title>
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: light; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               background: #F5F0E8; color: #1A1410; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        main { max-width: 460px; }
        .code { font-size: 96px; font-weight: 800; line-height: 1; opacity: .15; margin: 0; }
        h1 { font-size: 30px; margin: 8px 0 12px; }
        p { color: #5A5040; line-height: 1.6; margin: 0 0 28px; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 12px;
            background: #006B4A; color: #fff; font-weight: 700; text-decoration: none; margin: 4px; }
        a.ghost { background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.4); }
    </style>
</head>
<body>
<main>
    <p class="code" aria-hidden="true">500</p>
    <h1>Something went wrong on our side</h1>
    <p>We've been notified and are looking into it. Your purchases and downloads are safe. Please try again in a minute.</p>
    <a href="/">Back to home</a>
    <a class="ghost" href="/contact/">Contact support</a>
</main>
</body>
</html>
